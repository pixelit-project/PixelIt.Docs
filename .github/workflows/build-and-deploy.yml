name: Build and Deploy
on: [push]
jobs:
  prepare-webflasher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Test local firmware selection
        run: node .github/tests/test_local_firmware.js

      - name: Test Webflasher release selection
        run: python -B -m unittest discover -s .github/tests -v

      - name: Build manifest files for Webflasher 🔧
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python .github/webflasher.py

      - name: Display structure of files 🔍
        run: ls -R ./src/.vuepress/public/pixelit_flasher

      - name: Upload build artifacts 💾
        uses: actions/upload-artifact@v4
        with:
          name: webflasher-assets
          path: ./src/.vuepress/public/pixelit_flasher/

      - name: Commit Webflasher asset changes📝
        run: |
          git config --global user.name 'PixelIt Pipeline Bot'
          git config --global user.email 'bot@pixelit'
          if [[ $(git status --porcelain) ]]; then
            git add --all
            git commit -m "Updated Webflasher assets via GitHub Actions"
            git push
            echo "Changes committed."
          else
            echo "No uncommitted changes found."
          fi

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: prepare-webflasher
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      # Checkout still contains the assets from the triggering commit. Replace
      # them completely so deleted firmware cannot reappear in the deployed site.
      - name: Remove Webflasher assets from checkout
        run: rm -rf ./src/.vuepress/public/pixelit_flasher

      - name: Download build artifacts 💾
        uses: actions/download-artifact@v4
        with:
          name: webflasher-assets
          path: ./src/.vuepress/public/pixelit_flasher

      - name: Display structure of downloaded files 🔍
        run: ls -R ./src/.vuepress/public

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build documentation
        run: npm run build

      - name: Deploy documentation 🚀
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.ACCESS_TOKEN }}
          external_repository: pixelit-project/pixelit-project.github.io
          publish_branch: gh-pages
          publish_dir: src/.vuepress/dist
